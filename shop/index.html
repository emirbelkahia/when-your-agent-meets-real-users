<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nordvik Market — Camping</title>
<style>
  :root {
    --ink: #14181d;
    --muted: #5f6b78;
    --line: #e3e7ec;
    --bg: #ffffff;
    --soft: #f6f8fa;
    --accent: #1c5d4a;
    --accent-soft: #e8f2ee;
    --warn: #8a4b1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  header {
    border-bottom: 1px solid var(--line);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 28px;
    height: 64px;
    position: sticky;
    top: 0;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    z-index: 5;
  }
  .brand { font-weight: 650; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
  .brand svg { width: 20px; height: 20px; }
  nav { display: flex; gap: 22px; color: var(--muted); font-size: 14px; }
  nav span:first-child { color: var(--ink); font-weight: 550; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 18px; color: var(--muted); }
  .searchbox {
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px;
    color: var(--muted); font-size: 13px; width: 210px; background: var(--soft);
  }

  .strip {
    background: var(--accent-soft); color: var(--accent);
    font-size: 13px; text-align: center; padding: 9px; font-weight: 500;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 34px 28px 96px; }
  h1 { font-size: 25px; margin: 0 0 4px; letter-spacing: -.02em; font-weight: 650; }
  .count { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 26px 22px; }
  .card { display: flex; flex-direction: column; }
  .thumb {
    aspect-ratio: 4 / 3; background: var(--soft); border: 1px solid var(--line);
    border-radius: 9px; display: grid; place-items: center; margin-bottom: 11px; position: relative;
  }
  .thumb { overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
  .thumb .fallback { display: grid; place-items: center; width: 100%; height: 100%; }
  .thumb svg { width: 62px; height: 62px; stroke: #9aa6b2; stroke-width: 1.2; fill: none; }
  .flag {
    position: absolute; top: 9px; left: 9px; background: #fff; border: 1px solid var(--line);
    border-radius: 5px; font-size: 10.5px; padding: 3px 6px; color: var(--muted); font-weight: 550;
    letter-spacing: .02em; text-transform: uppercase;
  }
  .oos { position: absolute; inset: 0; background: rgba(255,255,255,.62); border-radius: 9px;
         display: grid; place-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
  .name { font-weight: 550; font-size: 14.5px; letter-spacing: -.005em; }
  .seller { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .row { display: flex; align-items: baseline; gap: 9px; margin-top: 7px; }
  .price { font-weight: 650; font-size: 15px; }
  .rate { color: var(--muted); font-size: 12.5px; }
  .sellercopy {
    margin-top: 9px; padding: 9px 10px; background: var(--soft); border-radius: 7px;
    font-size: 11.5px; line-height: 1.45; color: var(--muted); white-space: pre-wrap;
    max-height: 76px; overflow: hidden;
  }
  .sellercopy span {
    display: block; text-transform: uppercase; letter-spacing: .04em; font-size: 9.5px;
    font-weight: 650; color: #8b96a2; margin-bottom: 3px;
  }

  /* Chat widget */
  #bubble {
    position: fixed; right: 26px; bottom: 26px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); border: 0; cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 8px 26px rgba(20,24,29,.22); z-index: 20;
  }
  #bubble svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 1.6; fill: none; }
  /* Backdrop for the expanded panel — the chat is where the talk happens, so
     when it goes large the storefront gets out of the way. */
  #backdrop {
    position: fixed; inset: 0; background: rgba(20,24,29,.45); z-index: 20;
    display: none; backdrop-filter: blur(2px);
  }
  #backdrop.on { display: block; }

  #panel {
    position: fixed; right: 26px; bottom: 26px; width: 392px; max-height: 74vh;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 20px 60px rgba(20,24,29,.20); display: none; flex-direction: column;
    z-index: 21; overflow: hidden;
  }
  #panel.open { display: flex; }

  /* Presentation size. Everything in the panel scales up, and the message column
     is capped so long answers stay readable instead of running the full width. */
  #panel.expanded {
    right: auto; bottom: auto; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(1240px, 94vw); height: min(920px, 90vh); max-height: 90vh;
    border-radius: 18px; box-shadow: 0 40px 120px rgba(20,24,29,.34);
  }

  .chat-head {
    padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 11px;
  }
  #panel.expanded .chat-head { padding: 20px 26px; gap: 14px; }
  .chat-head .who { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: block; flex: none;
    border: 1px solid var(--line); background: var(--soft); object-fit: cover;
  }
  #panel.expanded .chat-head .avatar { width: 46px; height: 46px; }
  /* inline-block, or a span ignores width and height entirely */
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #2ea36b; flex: none; margin-right: 3px; vertical-align: baseline;
  }
  .chat-head strong { font-size: 14px; font-weight: 600; display: block; }
  .chat-head .sub { color: var(--muted); font-size: 12px; }
  #panel.expanded .chat-head strong { font-size: 18px; }
  #panel.expanded .chat-head .sub { font-size: 14px; }
  .headbtns { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .headbtns button {
    border: 0; background: none; cursor: pointer; color: var(--muted);
    width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
  }
  .headbtns button:hover { background: var(--soft); color: var(--ink); }
  .headbtns svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; }
  #panel.expanded .headbtns button { width: 38px; height: 38px; }
  #panel.expanded .headbtns svg { width: 19px; height: 19px; }

  #log { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  #panel.expanded #log {
    padding: 30px max(30px, calc((100% - 900px) / 2)); gap: 20px;
  }
  .msg { max-width: 88%; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  #panel.expanded .msg { font-size: 17px; line-height: 1.62; max-width: 78%; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; padding: 9px 13px; border-radius: 14px 14px 3px 14px; }
  #panel.expanded .msg.user { padding: 13px 18px; border-radius: 18px 18px 4px 18px; }
  .msg.bot { background: var(--soft); padding: 10px 13px; border-radius: 14px 14px 14px 3px; }
  #panel.expanded .msg.bot { padding: 15px 19px; border-radius: 18px 18px 18px 4px; }
  .msg.bot.err { background: #fdf0ea; color: var(--warn); }
  /* Bot turns are a row so the avatar sits beside the bubble. */
  .botrow { display: flex; align-items: flex-start; gap: 9px; align-self: flex-start; max-width: 100%; }
  #panel.expanded .botrow { gap: 13px; }
  .botrow .avatar { width: 28px; height: 28px; margin-top: 2px; }
  #panel.expanded .botrow .avatar { width: 38px; height: 38px; margin-top: 3px; }
  .typing { display: flex; gap: 4px; padding: 12px 14px; background: var(--soft); border-radius: 14px; }
  #panel.expanded .typing { padding: 16px 18px; gap: 6px; }
  #panel.expanded .typing i { width: 8px; height: 8px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: #b3bdc7; animation: b 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes b { 0%,60%,100% { opacity: .32 } 30% { opacity: 1 } }
  .chat-foot { border-top: 1px solid var(--line); padding: 11px; display: flex; gap: 8px; }
  #panel.expanded .chat-foot { padding: 18px max(18px, calc((100% - 900px) / 2)); gap: 12px; }
  .chat-foot input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px; outline: none; }
  #panel.expanded .chat-foot input { padding: 14px 18px; font-size: 17px; border-radius: 10px; }
  #panel.expanded .chat-foot button { padding: 0 26px; font-size: 17px; border-radius: 10px; }
  .chat-foot input:focus { border-color: var(--accent); }
  .chat-foot button { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 15px; cursor: pointer; font-weight: 550; font-size: 14px; }
  .chat-foot button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>

<div class="strip">Free standard delivery on orders over €75 · Standard 3–5 working days</div>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1c5d4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 18l5.5-7.5 3.5 4.5 3-4 8 7z"/><circle cx="17" cy="6" r="2"/>
    </svg>
    Nordvik Market
  </div>
  <nav><span>Camping</span><span>Hiking</span><span>Apparel</span><span>Sale</span></nav>
  <div class="header-right">
    <div class="searchbox">Search the store…</div>
    <span>Account</span><span>Basket (0)</span>
  </div>
</header>

<main>
  <h1>Camping</h1>
  <div class="count" id="count">Loading…</div>
  <div class="grid" id="grid"></div>
</main>

<button id="bubble" aria-label="Open the assistant">
  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.4-4.2A8 8 0 1 1 21 12z"/>
  </svg>
</button>

<div id="backdrop"></div>

<div id="panel">
  <div class="chat-head">
    <div class="who">
      <img class="avatar" src="/brand/assistant-avatar.png" alt="">
      <div>
        <strong>Nordvik Assistant</strong>
        <div class="sub"><span class="dot"></span> Product and delivery questions</div>
      </div>
    </div>
    <div class="headbtns">
      <button id="expand" aria-label="Expand" title="Presentation size">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3H4v5M15 3h5v5M9 21H4v-5M15 21h5v-5"/>
        </svg>
      </button>
      <button id="close" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="log">
    <div class="botrow">
      <img class="avatar" src="/brand/assistant-avatar.png" alt="">
      <div class="msg bot">Hi! Ask me anything about our camping gear — sizing, stock, delivery.</div>
    </div>
  </div>
  <div class="chat-foot">
    <input id="q" placeholder="Ask a question…" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>

<script>
/* Category line-art, chosen by keyword. Inline so the page has no network
   dependencies at all — a screencast should never wait on an asset. */
const ICONS = {
  tent:    '<path d="M3 19 12 5l9 14z"/><path d="M12 5v14"/><path d="m8 19 4-6 4 6"/>',
  bag:     '<rect x="3" y="7" width="18" height="11" rx="5.5"/><path d="M8 7v11M16 7v11"/>',
  stove:   '<path d="M12 3c1.5 3-1.5 4 0 7 2-1 3-3.5 2-5"/><path d="M6 12h12v3a6 6 0 0 1-12 0z"/>',
  pot:     '<path d="M5 9h14v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M3 11h2M19 11h2"/>',
  pack:    '<path d="M8 7V5a4 4 0 0 1 8 0v2"/><rect x="5" y="7" width="14" height="14" rx="3"/><path d="M9 13h6"/>',
  jacket:  '<path d="M9 4 5 7v13h14V7l-4-3"/><path d="M12 4v16"/><path d="M9 4c0 2 1.4 3 3 3s3-1 3-3"/>',
  poles:   '<path d="M8 3v18M16 3v18"/><path d="M6 8h4M14 8h4"/>',
  lamp:    '<circle cx="12" cy="11" r="4"/><path d="M4 11h2M18 11h2M12 3v2M12 19v2"/>',
  mat:     '<rect x="3" y="9" width="18" height="7" rx="3.5"/><path d="M7 9v7M12 9v7M17 9v7"/>',
  filter:  '<path d="M6 4h12l-5 6v8l-2 2v-10z"/>',
  chair:   '<path d="M6 4v9h12V4"/><path d="M6 13 4 21M18 13l2 8M8 17h8"/>',
  table:   '<path d="M3 9h18"/><path d="M5 9v11M19 9v11"/><path d="M3 9 12 4l9 5"/>',
  lantern: '<path d="M9 3h6"/><path d="M10 3v3h4V3"/><rect x="7" y="6" width="10" height="11" rx="2.5"/><path d="M9 17v3M15 17v3"/>',
  sock:    '<path d="M9 3h5v9l4 4a3.5 3.5 0 0 1-5 5l-6-6V3z"/>',
  base:    '<path d="M8 4 5 6v14h14V6l-3-2"/><path d="M8 4h8"/>',
  generic: '<circle cx="12" cy="12" r="8"/>'
};
const pick = (name) => {
  const n = name.toLowerCase();
  if (n.includes('lantern')) return ICONS.lantern;
  if (n.includes('tent')) return ICONS.tent;
  if (n.includes('sleeping bag')) return ICONS.bag;
  if (n.includes('stove')) return ICONS.stove;
  if (n.includes('pot')) return ICONS.pot;
  if (n.includes('backpack') || n.includes('pack')) return ICONS.pack;
  if (n.includes('jacket') || n.includes('shell')) return ICONS.jacket;
  if (n.includes('poles')) return ICONS.poles;
  if (n.includes('headlamp')) return ICONS.lamp;
  if (n.includes('mat')) return ICONS.mat;
  if (n.includes('filter') || n.includes('bladder')) return ICONS.filter;
  if (n.includes('chair')) return ICONS.chair;
  if (n.includes('table')) return ICONS.table;
  if (n.includes('socks')) return ICONS.sock;
  if (n.includes('base layer')) return ICONS.base;
  return ICONS.generic;
};

const eur = (n) => '€' + n.toFixed(2).replace('.00', '');

/**
 * Local file first, then the image_url carried on the record, then a line icon.
 *
 * Local first because a screencast should never wait on a network round trip.
 * The remote URL exists so a clone with the index but not the files still looks
 * like a shop.
 */
function imageFallback(img) {
  const remote = img.dataset.remote;
  if (remote && img.src !== remote) {
    img.dataset.remote = '';
    img.src = remote;
    return;
  }
  const div = document.createElement('div');
  div.className = 'fallback';
  div.innerHTML = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS.generic}</svg>`;
  img.replaceWith(div);
}

fetch('/api/products').then(r => r.json()).then(({ products }) => {
  document.getElementById('count').textContent = products.length + ' products';
  document.getElementById('grid').innerHTML = products.map(p => `
    <article class="card">
      <div class="thumb">
        <img src="/images/${p.objectID}.jpg" alt="${p.name}" loading="eager"
             data-remote="${p.image_url || ''}" onerror="imageFallback(this)">
        ${p.seller_type === 'third_party' ? '<span class="flag">Marketplace</span>' : ''}
        ${p.in_stock ? '' : '<div class="oos">Out of stock</div>'}
      </div>
      <div class="name">${p.name}</div>
      <div class="seller">${p.seller_type === 'third_party' ? 'Sold by ' + p.seller_name : p.brand}</div>
      <div class="row">
        <span class="price">${eur(p.price_eur)}</span>
        <span class="rate">★ ${p.rating} (${p.review_count})</span>
      </div>
      ${p.seller_type === 'third_party' && p.description ? `<div class="sellercopy"><span>Listing copy from the seller</span>${p.description}</div>` : ''}
    </article>`).join('');
});

const panel = document.getElementById('panel');
const log = document.getElementById('log');
const q = document.getElementById('q');
const send = document.getElementById('send');

const backdrop = document.getElementById('backdrop');
const AVATAR = '/brand/assistant-avatar.png';

const openPanel = () => { panel.classList.add('open'); q.focus(); };
const expand = () => { panel.classList.add('expanded'); backdrop.classList.add('on'); q.focus(); };
const collapse = () => { panel.classList.remove('expanded'); backdrop.classList.remove('on'); };
const closePanel = () => { panel.classList.remove('open'); collapse(); };

document.getElementById('bubble').onclick = openPanel;
document.getElementById('close').onclick = closePanel;
document.getElementById('expand').onclick = () =>
  panel.classList.contains('expanded') ? collapse() : expand();
backdrop.onclick = collapse;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && panel.classList.contains('expanded')) collapse();
});

// Query params so a recording can start in the state you want rather than on a
// click you would have to trim. ?chat=open opens the panel, ?chat=big opens it at
// presentation size — which is how it should be filmed, because this panel is
// where the talk actually happens.
const wanted = new URLSearchParams(location.search).get('chat');
if (wanted === 'open' || wanted === 'big') openPanel();
if (wanted === 'big') expand();

function add(text, who, isErr) {
  const el = document.createElement('div');
  el.className = 'msg ' + who + (isErr ? ' err' : '');
  el.textContent = text;
  if (who === 'bot') {
    const row = document.createElement('div');
    row.className = 'botrow';
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = AVATAR;
    img.alt = '';
    row.append(img, el);
    log.appendChild(row);
  } else {
    log.appendChild(el);
  }
  log.scrollTop = log.scrollHeight;
  return el;
}

async function ask() {
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  send.disabled = true;
  add(text, 'user');

  const dots = document.createElement('div');
  dots.className = 'botrow';
  dots.innerHTML =
    `<img class="avatar" src="${AVATAR}" alt=""><div class="typing"><i></i><i></i><i></i></div>`;
  log.appendChild(dots);
  log.scrollTop = log.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    dots.remove();
    if (!res.ok) add(data.error || 'Something went wrong.', 'bot', true);
    else add(data.answer, 'bot');
  } catch (e) {
    dots.remove();
    add('Could not reach the assistant: ' + e.message, 'bot', true);
  }
  send.disabled = false;
  q.focus();
}

send.onclick = ask;
q.onkeydown = (e) => { if (e.key === 'Enter') ask(); };
</script>
</body>
</html>
